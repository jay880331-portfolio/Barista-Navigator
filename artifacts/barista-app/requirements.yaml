packages:
  "@vis.gl/react-google-maps": "Google Maps rendering for the barista map view"
  "zustand": "Global state management for auth and user profile"
  "framer-motion": "Smooth page transitions and micro-interactions"
  "date-fns": "Date formatting for feed posts and recipes"
  "clsx": "Utility for conditionally joining classNames"
  "tailwind-merge": "Utility for merging tailwind classes safely"

images:
  - path: "artifacts/barista-app/public/images/logo.png"
    description: "Minimalist warm-toned coffee bean and cup logo mark, vector illustration, white background"
    aspect_ratio: "1:1"
  - path: "artifacts/barista-app/public/images/hero-bg.png"
    description: "Abstract soft gradient mesh in creamy white, warm beige, and subtle gold tones, luxurious modern feel"
    aspect_ratio: "16:9"

notes:
  - Auth token is stored in localStorage and injected globally into fetch headers
  - UI is strictly constrained to a 430px max-width mobile viewport, centered on desktop
  - Google Maps uses VITE_GOOGLE_MAPS_API_KEY env var
